<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>師道傳燈 · 國文教育實習錄 | 捌月至拾貳月實習紀事</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪶</text></svg>">
  <style>
    :root {
      /* 淡紫、紫藤、粉櫻古典色彩系統 */
      --primary: #8a4ba0;
      --primary-hover: #733b87;
      --primary-light: #fbf5fe;
      --primary-border: #e9d5f5;
      
      --accent-pink: #d9658b;
      --accent-pink-light: #fdf2f7;
      --accent-pink-border: #fad4e4;

      --bg: #faf7fc;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: #eee2f3;
      --text-main: #2d2235;
      --text-muted: #6b5b75;
      --text-light: #9d8fa7;

      --seal-red: #c0392b;
      --seal-bg: #fdf2f0;

      --cat-outdoor: #0d9488;
      --cat-outdoor-bg: #f0fdfa;
      --cat-study: #8a4ba0;
      --cat-study-bg: #f7edfd;
      --cat-teach: #c04874;
      --cat-teach-bg: #fdf0f5;
      --cat-mentor: #d97736;
      --cat-mentor-bg: #fef5ec;
      --cat-admin: #4f6fb8;
      --cat-admin-bg: #f0f4fd;

      --shadow-sm: 0 2px 5px rgba(120, 60, 140, 0.04);
      --shadow-md: 0 6px 16px rgba(120, 60, 140, 0.07);
      --shadow-lg: 0 16px 30px rgba(120, 60, 140, 0.1);
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 26px;
    }

    [data-theme="dark"] {
      --bg: #140d1e;
      --card-bg: rgba(28, 19, 41, 0.95);
      --card-border: #352449;
      --text-main: #f5edf8;
      --text-muted: #b7a4c4;
      --text-light: #7b698a;

      --primary: #b370cb;
      --primary-hover: #c888df;
      --primary-light: #251636;
      --primary-border: #4d2f6a;

      --accent-pink: #eb7fa3;
      --accent-pink-light: #321626;
      --accent-pink-border: #5c2443;

      --cat-outdoor-bg: #0f2d29;
      --cat-study-bg: #2d163d;
      --cat-teach-bg: #381525;
      --cat-mentor-bg: #3b1e10;
      --cat-admin-bg: #14223d;

      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 8px 18px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 16px 32px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "PingFang TC", "Songti TC", "Noto Serif TC", "Source Han Serif TC", "Kaiti TC", "BiauKai", "DFKai-SB", STSong, -apple-system, serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(217, 101, 139, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(138, 75, 160, 0.05) 0%, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.7;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 36px 20px 80px 20px;
    }

    /* Classical Header */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 22px;
      border-bottom: 2px solid transparent;
      border-image: linear-gradient(to right, transparent, var(--primary-border), var(--accent-pink-border), transparent) 1;
      position: relative;
    }

    .header-branding {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Traditional Chinese Seal Chop (印章) */
    .chinese-seal {
      width: 48px;
      height: 48px;
      border: 2px solid var(--seal-red);
      background: var(--seal-bg);
      color: var(--seal-red);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: 1px;
      box-shadow: inset 0 0 4px rgba(192, 57, 43, 0.15), 0 2px 6px rgba(192, 57, 43, 0.1);
      user-select: none;
      flex-shrink: 0;
    }

    .header-title h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 3px;
      letter-spacing: 0.02em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Classical Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      letter-spacing: 0.03em;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent-pink) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(138, 75, 160, 0.25);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(138, 75, 160, 0.35);
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-main);
      border-color: var(--card-border);
    }
    .btn-secondary:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background-color: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    /* Month Selector Tabs (8月～12月 / 1月) - 古典雅緻捲軸風 */
    .month-nav-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 10px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .month-tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr) auto;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .month-tabs {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .month-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 10px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }

    .month-tab:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .month-tab.active {
      background: linear-gradient(145deg, var(--primary-light), var(--accent-pink-light));
      color: var(--primary);
      border: 1px solid var(--primary-border);
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(138, 75, 160, 0.1);
    }

    .month-tab-name {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .month-tab-sub {
      font-size: 0.76rem;
      color: var(--accent-pink);
      margin-top: 2px;
      letter-spacing: 0.04em;
    }

    .month-tab-count {
      position: absolute;
      top: 6px;
      right: 8px;
      background: var(--primary);
      color: white;
      font-size: 0.68rem;
      padding: 1px 7px;
      border-radius: 999px;
      font-weight: 600;
    }

    /* Month Banner */
    .month-banner {
      background: linear-gradient(135deg, rgba(138, 75, 160, 0.07) 0%, rgba(217, 101, 139, 0.07) 100%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 22px 28px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }

    .month-banner::after {
      content: "🌸";
      position: absolute;
      right: 20px;
      bottom: -10px;
      font-size: 5rem;
      opacity: 0.07;
      pointer-events: none;
    }

    .month-banner-title h2 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.03em;
    }

    .month-banner-title p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .month-stats-badge {
      display: flex;
      gap: 12px;
    }

    .badge-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }

    /* Filter & Search Bar */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 22px;
    }

    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cat-pill {
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-pill:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .cat-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(138, 75, 160, 0.25);
    }

    .search-input {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
      min-width: 240px;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary);
    }

    /* Itinerary / Activity Schedule List */
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .event-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 18px 24px;
      display: grid;
      grid-template-columns: 96px 1fr auto;
      align-items: center;
      gap: 22px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .event-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(to bottom, var(--primary), var(--accent-pink));
      opacity: 0;
      transition: opacity 0.2s;
    }

    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-border);
    }

    .event-card:hover::before {
      opacity: 1;
    }

    @media (max-width: 650px) {
      .event-card {
        grid-template-columns: 1fr;
        gap: 14px;
      }
    }

    /* Classical Date Box */
    .date-box {
      background: linear-gradient(145deg, var(--primary-light), var(--accent-pink-light));
      border: 1px solid var(--primary-border);
      border-radius: var(--radius-sm);
      padding: 10px 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .date-box-month {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.05em;
    }

    .date-box-day {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1.1;
      margin: 2px 0;
      font-family: Georgia, "Songti TC", serif;
    }

    .date-box-weekday {
      font-size: 0.72rem;
      color: var(--accent-pink);
    }

    /* Event Info */
    .event-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .event-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cat-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .badge-outdoor { background: var(--cat-outdoor-bg); color: var(--cat-outdoor); border: 1px solid #99f6e4; }
    .badge-study { background: var(--cat-study-bg); color: var(--cat-study); border: 1px solid var(--primary-border); }
    .badge-teach { background: var(--cat-teach-bg); color: var(--cat-teach); border: 1px solid var(--accent-pink-border); }
    .badge-mentor { background: var(--cat-mentor-bg); color: var(--cat-mentor); border: 1px solid #fde2cc; }
    .badge-admin { background: var(--cat-admin-bg); color: var(--cat-admin); border: 1px solid #c7d7f9; }

    .event-location {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .event-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.4;
      letter-spacing: 0.02em;
    }

    .event-summary {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Event Action & Photo Teaser */
    .event-action {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .photo-indicator {
      background: var(--bg);
      border: 1px solid var(--card-border);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .view-arrow {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--accent-pink);
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.03em;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border: 2px dashed var(--card-border);
      border-radius: var(--radius-lg);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    /* MODAL: Event Detail & Photos */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(20, 13, 30, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      padding: 20px;
    }

    .modal-backdrop.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-window {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      transform: translateY(20px) scale(0.98);
      transition: all 0.25s ease;
      overflow: hidden;
    }

    .modal-backdrop.active .modal-window {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      padding: 22px 26px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to right, var(--primary-light), transparent);
    }

    .modal-body {
      padding: 26px;
      overflow-y: auto;
    }

    .modal-footer {
      padding: 16px 26px;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      font-size: 1.6rem;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .modal-close-btn:hover {
      background: var(--bg);
      color: var(--text-main);
    }

    /* Photos Section inside modal */
    .detail-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin: 16px 0 24px 0;
    }

    .gallery-img-box {
      position: relative;
      height: 160px;
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-sm);
    }

    .gallery-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .gallery-img-box:hover img {
      transform: scale(1.06);
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.03em;
    }

    .section-content-box {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      font-size: 0.94rem;
      line-height: 1.7;
      white-space: pre-wrap;
      margin-bottom: 22px;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 8, 24, 0.94);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }

    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }

    .lightbox-img {
      max-width: 92vw;
      max-height: 82vh;
      object-fit: contain;
      border-radius: var(--radius-sm);
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.18);
      border: none;
      color: white;
      font-size: 2rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-prev { left: 24px; }
    .lightbox-next { right: 24px; }
    
    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.18);
      border: none;
      color: white;
      font-size: 1.6rem;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
    }

    .lightbox-caption {
      position: absolute;
      bottom: 24px;
      color: white;
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 18px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }

    /* Forms */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.86rem; font-weight: 700; margin-bottom: 6px; color: var(--text-main); }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: var(--bg);
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    textarea.form-control { min-height: 95px; resize: vertical; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--primary);
      color: white;
      padding: 12px 22px;
      border-radius: 999px;
      box-shadow: var(--shadow-lg);
      font-size: 0.92rem;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 3000;
      letter-spacing: 0.03em;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

<div class="container">
  <!-- Classical Header -->
  <header class="top-header">
    <div class="header-branding">

    activities.unshift(act0804);
  }

  if (!activities.some(a => a.id === 'act-0814') && act0814) {
    activities.push(act0814);
  }

  }

// Render Month Selector Tabs
function renderMonthTabs() {
  const container = document.getElementById('monthTabs');
  
  container.innerHTML = MONTHS_CONFIG.map(m => {
    let count = 0;
    if (m.id === 'all') {
      count = activities.length;
    } else {
      count = activities.filter(a => {
        if (!a.date) return false;
        const monthNum = parseInt(a.date.split('-')[1], 10);
        return monthNum === parseInt(m.id, 10);
      }).length;
    }

    const isActive = selectedMonth === m.id;

    return `
      <button class="month-tab ${isActive ? 'active' : ''}" onclick="selectMonth('${m.id}')">
        <span class="month-tab-name">${m.label}</span>
        <span class="month-tab-sub">${m.en}</span>
        ${count > 0 ? `<span class="month-tab-count">${count}</span>` : ''}
      </button>
    `;
  }).join('');

  // Update Month Banner
  const currentCfg = MONTHS_CONFIG.find(m => m.id === selectedMonth) || MONTHS_CONFIG[0];
  document.getElementById('currentMonthTitle').textContent = `🗓️ ${currentCfg.label} · ${currentCfg.en}紀事`;
  document.getElementById('currentMonthDesc').textContent = currentCfg.desc;
}

function selectMonth(monthId) {
  selectedMonth = monthId;
  renderMonthTabs();
  renderEvents();
}

function setCategoryFilter(cat, elem) {
  selectedCategory = cat;
  document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.remove('active'));
  if (elem) elem.classList.add('active');
  renderEvents();
}

function handleSearch() {
  searchKeyword = document.getElementById('searchInput').value.trim();
  renderEvents();
}

// Get Weekday Name
function getWeekday(dateStr) {
  if (!dateStr) return '';
  const days = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
  const d = new Date(dateStr);
  return days[d.getDay()] || '';
}

function getCategoryBadge(cat) {
  switch (cat) {
    case '校外教學活動':
    case '校外教學': return `<span class="cat-badge badge-outdoor">🚌 校外教學</span>`;
    case '行政實習': return `<span class="cat-badge badge-admin">📘 行政實習</span>`;
    case '教學實習': return `<span class="cat-badge badge-teach">🌸 教學實習</span>`;
    case '導師實習': return `<span class="cat-badge badge-mentor">📙 導師實習</span>`;
    case '研習與專業成長': return `<span class="cat-badge badge-study">🟣 研習紀錄</span>`;
    default: return `<span class="cat-badge badge-study">🟣 ${cat}</span>`;
  }
}

// Render Events List
function renderEvents() {
  let list = [...activities];

  // Month filter
  if (selectedMonth !== 'all') {
    const targetMonth = parseInt(selectedMonth, 10);
    list = list.filter(a => {
      if (!a.date) return false;
      const m = parseInt(a.date.split('-')[1], 10);
      return m === targetMonth;
    });
  }

  // Category filter
  if (selectedCategory !== 'all') {
    list = list.filter(a => a.category === selectedCategory);
  }

  // Search filter
  if (searchKeyword !== '') {
    const q = searchKeyword.toLowerCase();
    list = list.filter(a =>
      (a.title && a.title.toLowerCase().includes(q)) ||
      (a.description && a.description.toLowerCase().includes(q)) ||
      (a.reflection && a.reflection.toLowerCase().includes(q)) ||
      (a.location && a.location.toLowerCase().includes(q))
    );
  }

  // Sort ascending by date for chronological schedule flow
  list.sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));

  // Update banner counters
  document.getElementById('monthEventCount').textContent = list.length;
  const photoTotal = list.reduce((sum, a) => sum + (a.photos ? a.photos.length : 0), 0);
  document.getElementById('monthPhotoCount').textContent = photoTotal;

  const container = document.getElementById('eventsList');

  if (list.length === 0) {
    const currentCfg = MONTHS_CONFIG.find(m => m.id === selectedMonth) || { label: '' };
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🪶</div>
        <h3 style="color: var(--primary);">${currentCfg.label} 目前尚無已登錄之實習紀事</h3>
        <p style="color: var(--text-muted); margin: 8px 0 16px 0;">點擊下方按鈕即可為此月份新增備課、觀課、試教或研習紀錄！</p>
        <button class="btn btn-primary" onclick="openAddModalForMonth('${selectedMonth}')">
          🖋️ 新增 ${currentCfg.label} 實習紀事
        </button>
      </div>
    `;
    return;
  }

  container.innerHTML = list.map(act => {
    const parts = (act.date || '').split('-');
    const mStr = parts[1] ? `${parseInt(parts[1], 10)}月` : '--';
    const dStr = parts[2] ? parts[2] : '--';
    const weekday = getWeekday(act.date);
    const photoCount = act.photos ? act.photos.length : 0;
    const catBadge = getCategoryBadge(act.category);

    return `
      <div class="event-card" onclick="openDetailModal('${act.id}')">
        <!-- Date Box -->
        <div class="date-box">
          <span class="date-box-month">${mStr}</span>
          <span class="date-box-day">${dStr}</span>
          <span class="date-box-weekday">${weekday}</span>
        </div>

        <!-- Info -->
        <div class="event-info">
          <div class="event-meta">
            ${catBadge}
          </div>
          <h3 class="event-title">${act.title}</h3>
          <p class="event-summary">${act.description || '點擊查看詳細紀要與照片...'}</p>
        </div>

        <!-- Action / Photo indicator -->
        <div class="event-action">
          ${photoCount > 0 ? `
            <span class="photo-indicator">📷 ${photoCount} 張相片</span>
          ` : `
            <span class="photo-indicator" style="opacity: 0.7;">📝 詳細紀要</span>
          `}
          <span class="view-arrow">查看照片與說明 ➔</span>
        </div>
      </div>
    `;
  }).join('');
}

// Open Detail Modal
function openDetailModal(id) {
  const act = activities.find(a => a.id === id);
  if (!act) return;

  activeDetailActivity = act;

  document.getElementById('detailCatBadge').outerHTML = getCategoryBadge(act.category);
  const newBadge = document.querySelector('.modal-header .cat-badge');
  if (newBadge) newBadge.id = 'detailCatBadge';

  document.getElementById('detailTitle').textContent = act.title;
  document.getElementById('detailDate').textContent = `${act.date || ''} (${getWeekday(act.date)})`;
  
  document.getElementById('detailDescription').textContent = act.description || '（無活動內容說明）';
  document.getElementById('detailReflection').textContent = act.reflection || '（尚未填寫心得省思）';

  // Photos Gallery
  const photosSection = document.getElementById('detailPhotosSection');
  const gallery = document.getElementById('detailGallery');
  const countElem = document.getElementById('detailPhotoCount');

  if (act.photos && act.photos.length > 0) {
    photosSection.style.display = 'block';
    countElem.textContent = act.photos.length;
    gallery.innerHTML = act.photos.map((p, idx) => `
      <div class="gallery-img-box" onclick="openLightboxFromList(${JSON.stringify(act.photos).replace(/"/g, '&quot;')}, ${idx})">
        <img src="${encodeURI(p)}" alt="相片 ${idx+1}">
      </div>
    `).join('');
  } else {
    photosSection.style.display = 'none';
  }

  openModal('detailModal');
}

function handleEditCurrentActivity() {
  if (!activeDetailActivity) return;
  closeModal('detailModal');
  openEditModal(activeDetailActivity);
}

function handleDeleteCurrentActivity() {
  if (!activeDetailActivity) return;
  if (confirm(`確定要刪除「${activeDetailActivity.title}」這筆紀事嗎？`)) {
    activities = activities.filter(a => a.id !== activeDetailActivity.id);
    saveData();
    closeModal('detailModal');
    showToast('🗑️ 紀事已成功刪除');
  }
}

// Add / Edit Modal
function openAddModal() {
  openAddModalForMonth(selectedMonth === 'all' ? '8' : selectedMonth);
}

function openAddModalForMonth(monthNum) {
  document.getElementById('formModalTitle').textContent = '🖋️ 新增國文實習紀事';
  document.getElementById('activityForm').reset();
  document.getElementById('formActivityId').value = '';
  
  const m = monthNum.padStart(2, '0');
  const defaultDate = `2026-${m}-01`;
  document.getElementById('formDate').value = defaultDate;
  openModal('formModal');
}

function openEditModal(act) {
  document.getElementById('formModalTitle').textContent = '✏️ 編輯國文實習紀事';
  document.getElementById('formActivityId').value = act.id;
  document.getElementById('formTitle').value = act.title || '';
  document.getElementById('formCategory').value = act.category || '研習與專業成長';
  document.getElementById('formDate').value = act.date || '';
  document.getElementById('formPhotos').value = (act.photos || []).join(', ');
  document.getElementById('formDescription').value = act.description || '';
  document.getElementById('formReflection').value = act.reflection || '';
  openModal('formModal');
}

function saveActivity(e) {
  e.preventDefault();
  const id = document.getElementById('formActivityId').value;
  const title = document.getElementById('formTitle').value.trim();
  const category = document.getElementById('formCategory').value;
  const date = document.getElementById('formDate').value;
  
  const rawPhotos = document.getElementById('formPhotos').value.trim();
  const photos = rawPhotos ? rawPhotos.split(',').map(p => p.trim()).filter(Boolean) : [];

  const description = document.getElementById('formDescription').value.trim();
  const reflection = document.getElementById('formReflection').value.trim();

  if (id) {
    const idx = activities.findIndex(a => a.id === id);
    if (idx !== -1) {
      activities[idx] = { ...activities[idx], title, category, date, photos, description, reflection };
      showToast('🌸 紀事已成功更新');
    }
  } else {
    const newAct = {
      id: 'act-' + Date.now(),
      title,
      category,
      date,
      photos,
      description,
      reflection
    };
    activities.push(newAct);
    showToast('🌸 紀事新增成功');
  }

  saveData();
  closeModal('formModal');
}

// Lightbox
function openLightboxFromList(photosList, startIndex = 0) {
  if (!photosList || photosList.length === 0) return;
  currentLightboxImages = photosList;
  currentLightboxIndex = startIndex;
  updateLightboxView();
  document.getElementById('photoLightbox').classList.add('active');
  document.addEventListener('keydown', handleLightboxKeydown);
}

function updateLightboxView() {
  const imgUrl = currentLightboxImages[currentLightboxIndex];
  document.getElementById('lightboxImg').src = encodeURI(imgUrl);
  document.getElementById('lightboxCaption').textContent = `相片 ${currentLightboxIndex + 1} / ${currentLightboxImages.length} (${imgUrl.split('/').pop()})`;
}

function prevLightboxImage(e) {
  if (e) e.stopPropagation();
  currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxImages.length) % currentLightboxImages.length;
  updateLightboxView();
}

function nextLightboxImage(e) {
  if (e) e.stopPropagation();
  currentLightboxIndex = (currentLightboxIndex + 1) % currentLightboxImages.length;
  updateLightboxView();
}

function closeLightboxDirect() {
  document.getElementById('photoLightbox').classList.remove('active');
  document.removeEventListener('keydown', handleLightboxKeydown);
}

function closeLightbox(e) {
  if (e.target.id === 'photoLightbox') closeLightboxDirect();
}

function handleLightboxKeydown(e) {
  if (e.key === 'Escape') closeLightboxDirect();
  if (e.key === 'ArrowLeft') prevLightboxImage();
  if (e.key === 'ArrowRight') nextLightboxImage();
}

// Modal helper
function openModal(id) {
  const m = document.getElementById(id);
  if (m) m.classList.add('active');
}

function closeModal(id) {
  const m = document.getElementById(id);
  if (m) m.classList.remove('active');
}

function closeModalOnBackdrop(e, id) {
  if (e.target.id === id) closeModal(id);
}

// Settings & Backup
function openSettingsModal() {
  openModal('settingsModal');
}

function exportData() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(activities, null, 2));
  const a = document.createElement('a');
  a.href = dataStr;
  a.download = `國文教育實習錄備份_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  showToast('📥 備份檔已匯出');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const imported = JSON.parse(evt.target.result);
      if (Array.isArray(imported)) {
        activities = imported;
        saveData();
        closeModal('settingsModal');
        showToast('📂 資料已成功還原！');
      }
    } catch (err) {
      alert('解析失敗：' + err.message);
    }
  };
  reader.readAsText(file);
}

function resetToDefault() {
  if (confirm('確定要重設為初始 4 大預設紀事嗎？')) {
    activities = JSON.parse(JSON.stringify(DEFAULT_ACTIVITIES));
    saveData();
    closeModal('settingsModal');
    showToast('🔄 已重設為初始資料');
  }
}

// Theme
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const target = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', target);
  localStorage.setItem('practicum_theme', target);
  document.getElementById('themeToggle').textContent = target === 'dark' ? '☀️' : '🌙';
}

function applyTheme() {
  const saved = localStorage.getItem('practicum_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙';
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2600);
}

window.addEventListener('DOMContentLoaded', init);
</script>
