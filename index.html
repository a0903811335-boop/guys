<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教育實習歷程日誌 | 8月～12月實習活動總覽</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗓️</text></svg>">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      
      --cat-admin: #3b82f6;
      --cat-admin-bg: #eff6ff;
      --cat-teach: #10b981;
      --cat-teach-bg: #ecfdf5;
      --cat-mentor: #f59e0b;
      --cat-mentor-bg: #fffbeb;
      --cat-study: #8b5cf6;
      --cat-study-bg: #f5f3ff;

      --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.06);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.04);
      --shadow-lg: 0 12px 20px -3px rgb(0 0 0 / 0.1);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
    }

    [data-theme="dark"] {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --card-border: #232f48;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      
      --primary-light: #1e293b;
      --primary-border: #1e40af;
      
      --cat-admin-bg: #172554;
      --cat-teach-bg: #064e3b;
      --cat-mentor-bg: #451a03;
      --cat-study-bg: #2e1065;

      --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.4);
      --shadow-md: 0 4px 8px -1px rgb(0 0 0 / 0.5);
      --shadow-lg: 0 12px 20px -3px rgb(0 0 0 / 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 80px 20px;
    }

    /* Header */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }

    .header-title h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--card-bg);
      color: var(--text-main);
      border-color: var(--card-border);
    }
    .btn-secondary:hover {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background-color: var(--primary-light);
    }

    /* Month Selector Tabs (8月～12月 / 1月) */
    .month-nav-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 8px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .month-tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr) auto;
      gap: 6px;
    }

    @media (max-width: 768px) {
      .month-tabs {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .month-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .month-tab:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .month-tab.active {
      background: var(--primary);
      color: white;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }

    .month-tab-name {
      font-size: 1rem;
      font-weight: 700;
    }

    .month-tab-sub {
      font-size: 0.72rem;
      opacity: 0.85;
      margin-top: 2px;
    }

    .month-tab-count {
      position: absolute;
      top: 6px;
      right: 8px;
      background: rgba(0, 0, 0, 0.15);
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: 999px;
    }

    .month-tab.active .month-tab-count {
      background: rgba(255, 255, 255, 0.3);
      color: white;
    }

    /* Month Header Banner */
    .month-banner {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.08) 0%, rgba(139, 92, 246, 0.08) 100%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .month-banner-title h2 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .month-banner-title p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .month-stats-badge {
      display: flex;
      gap: 12px;
    }

    .badge-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Search and Category Filter */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 20px;
    }

    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cat-pill {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-pill:hover, .cat-pill.active {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    .cat-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .search-input {
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
      min-width: 220px;
    }
    .search-input:focus { border-color: var(--primary); }

    /* Itinerary / Activity Schedule List */
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .event-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      display: grid;
      grid-template-columns: 90px 1fr auto;
      align-items: center;
      gap: 20px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
    }

    @media (max-width: 650px) {
      .event-card {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    /* Date Box */
    .date-box {
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      border-radius: var(--radius-sm);
      padding: 10px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .date-box-month {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
    }

    .date-box-day {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.1;
      margin: 2px 0;
    }

    .date-box-weekday {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Event Info */
    .event-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .event-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .badge-admin { background: var(--cat-admin-bg); color: var(--cat-admin); border: 1px solid #bfdbfe; }
    .badge-teach { background: var(--cat-teach-bg); color: var(--cat-teach); border: 1px solid #a7f3d0; }
    .badge-mentor { background: var(--cat-mentor-bg); color: var(--cat-mentor); border: 1px solid #fde68a; }
    .badge-study { background: var(--cat-study-bg); color: var(--cat-study); border: 1px solid #ddd6fe; }

    .event-location {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .event-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.4;
    }

    .event-summary {
      font-size: 0.84rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Event Action & Photo Teaser */
    .event-action {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .photo-indicator {
      background: var(--bg);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .view-arrow {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border: 2px dashed var(--card-border);
      border-radius: var(--radius-lg);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    /* MODAL: Event Detail & Photos */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      padding: 20px;
    }

    .modal-backdrop.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-window {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      transform: translateY(20px) scale(0.98);
      transition: all 0.25s ease;
      overflow: hidden;
    }

    .modal-backdrop.active .modal-window {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .modal-close-btn:hover {
      background: var(--bg);
      color: var(--text-main);
    }

    /* Photos Section inside modal */
    .detail-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin: 16px 0 24px 0;
    }

    .gallery-img-box {
      position: relative;
      height: 160px;
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-sm);
    }

    .gallery-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .gallery-img-box:hover img {
      transform: scale(1.06);
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-content-box {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-size: 0.92rem;
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 20px;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }

    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }

    .lightbox-img {
      max-width: 92vw;
      max-height: 82vh;
      object-fit: contain;
      border-radius: var(--radius-sm);
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      font-size: 2rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-prev { left: 24px; }
    .lightbox-next { right: 24px; }
    
    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      font-size: 1.6rem;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
    }

    .lightbox-caption {
      position: absolute;
      bottom: 24px;
      color: white;
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 16px;
      border-radius: 999px;
    }

    /* Forms */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: var(--bg);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    textarea.form-control { min-height: 90px; resize: vertical; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: white;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      font-size: 0.9rem;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 3000;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Header -->
  <header class="top-header">
    <div class="header-title">
      <h1><span>🎓</span> 教育實習活動歷程日誌</h1>
      <p>按月份檢視實習行程與活動紀錄 · 點擊行程即可查看活動照片與心得說明</p>
    </div>
    
    <div class="header-actions">
      <button class="btn btn-primary" onclick="openAddModal()">
        <span>➕</span> 新增實習行程
      </button>
      <button class="btn-icon" id="themeToggle" onclick="toggleTheme()" title="切換深色/淺色模式">
        🌙
      </button>
      <button class="btn-icon" onclick="openSettingsModal()" title="資料管理與備份">
        ⚙️
      </button>
    </div>
  </header>

  <!-- Month Selector Tabs (8月～12月 / 1月) -->
  <section class="month-nav-container">
    <div class="month-tabs" id="monthTabs">
      <!-- Generated via JS -->
    </div>
  </section>

  <!-- Month Banner & Stats -->
  <section class="month-banner">
    <div class="month-banner-title">
      <h2 id="currentMonthTitle">🗓️ 8 月份實習活動</h2>
      <p id="currentMonthDesc">開學前行政籌備、專業增能研習與大學參訪</p>
    </div>
    <div class="month-stats-badge">
      <div class="badge-pill">📌 <span id="monthEventCount">4</span> 項活動行程</div>
      <div class="badge-pill">📷 <span id="monthPhotoCount">7</span> 張紀錄照片</div>
    </div>
  </section>

  <!-- Filter & Search Bar -->
  <section class="filter-bar">
    <div class="category-pills">
      <button class="cat-pill active" onclick="setCategoryFilter('all', this)">全部面向</button>
      <button class="cat-pill" onclick="setCategoryFilter('研習與專業成長', this)">🟣 研習與專業成長</button>
      <button class="cat-pill" onclick="setCategoryFilter('行政實習', this)">📘 行政實習</button>
      <button class="cat-pill" onclick="setCategoryFilter('教學實習', this)">📗 教學實習</button>
      <button class="cat-pill" onclick="setCategoryFilter('導師實習', this)">📙 導師實習</button>
    </div>

    <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋行程、主題或關鍵字..." oninput="handleSearch()">
  </section>

  <!-- Main Itinerary / Events List -->
  <main>
    <div class="events-list" id="eventsList">
      <!-- Events injected via JS -->
    </div>
  </main>
</div>

<!-- MODAL: Event Detail & Photos (點進去才看照片和說明) -->
<div id="detailModal" class="modal-backdrop" onclick="closeModalOnBackdrop(event, 'detailModal')">
  <div class="modal-window">
    <div class="modal-header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="detailCatBadge" class="cat-badge"></span>
        <h3 id="detailTitle" style="font-size: 1.25rem; font-weight: 700;"></h3>
      </div>
      <button class="modal-close-btn" onclick="closeModal('detailModal')">&times;</button>
    </div>
    
    <div class="modal-body">
      <!-- Meta Information -->
      <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 18px; font-size: 0.88rem; color: var(--text-muted); padding-bottom: 12px; border-bottom: 1px dashed var(--card-border);">
        <div>📅 <strong>活動日期：</strong><span id="detailDate"></span></div>

// Months configuration (8月 ~ 12月 / 1月 / 全部)

let activities = [];
let selectedMonth = "8"; // Default to August
let selectedCategory = "all";
let searchKeyword = "";
let activeDetailActivity = null;

// Lightbox state
let currentLightboxImages = [];
let currentLightboxIndex = 0;

function init() {
  loadData();
  applyTheme();
  renderMonthTabs();
  renderEvents();
}

function loadData() {
  const saved = localStorage.getItem('practicum_activities');
  activities = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_ACTIVITIES));
}

function saveData() {
  localStorage.setItem('practicum_activities', JSON.stringify(activities));
  renderMonthTabs();
  renderEvents();
}

// Render Month Selector Tabs
function renderMonthTabs() {
  const container = document.getElementById('monthTabs');
  
  container.innerHTML = MONTHS_CONFIG.map(m => {
    let count = 0;
    if (m.id === 'all') {
      count = activities.length;
    } else {
      count = activities.filter(a => {
        if (!a.date) return false;
        const monthNum = parseInt(a.date.split('-')[1], 10);
        return monthNum === parseInt(m.id, 10);
      }).length;
    }

    const isActive = selectedMonth === m.id;

    return `
      <button class="month-tab ${isActive ? 'active' : ''}" onclick="selectMonth('${m.id}')">
        <span class="month-tab-name">${m.label}</span>
        <span class="month-tab-sub">${m.en}</span>
        ${count > 0 ? `<span class="month-tab-count">${count}</span>` : ''}
      </button>
    `;
  }).join('');

  // Update Month Banner
  const currentCfg = MONTHS_CONFIG.find(m => m.id === selectedMonth) || MONTHS_CONFIG[0];
  document.getElementById('currentMonthTitle').textContent = `🗓️ ${currentCfg.label} 實習行程與活動`;
  document.getElementById('currentMonthDesc').textContent = currentCfg.desc;
}

function selectMonth(monthId) {
  selectedMonth = monthId;
  renderMonthTabs();
  renderEvents();
}

function setCategoryFilter(cat, elem) {
  selectedCategory = cat;
  document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.remove('active'));
  if (elem) elem.classList.add('active');
  renderEvents();
}

function handleSearch() {
  searchKeyword = document.getElementById('searchInput').value.trim();
  renderEvents();
}

// Get Weekday Name
function getWeekday(dateStr) {
  if (!dateStr) return '';
  const days = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
  const d = new Date(dateStr);
  return days[d.getDay()] || '';
}

function getCategoryBadge(cat) {
  switch (cat) {
    case '行政實習': return `<span class="cat-badge badge-admin">📘 行政實習</span>`;
    case '教學實習': return `<span class="cat-badge badge-teach">📗 教學實習</span>`;
    case '導師實習': return `<span class="cat-badge badge-mentor">📙 導師實習</span>`;
    case '研習與專業成長': return `<span class="cat-badge badge-study">🟣 研習增能</span>`;
    default: return `<span class="cat-badge badge-study">🟣 ${cat}</span>`;
  }
}

// Render Events List
function renderEvents() {
  let list = [...activities];

  // Month filter
  if (selectedMonth !== 'all') {
    const targetMonth = parseInt(selectedMonth, 10);
    list = list.filter(a => {
      if (!a.date) return false;
      const m = parseInt(a.date.split('-')[1], 10);
      return m === targetMonth;
    });
  }

  // Category filter
  if (selectedCategory !== 'all') {
    list = list.filter(a => a.category === selectedCategory);
  }

  // Search filter
  if (searchKeyword !== '') {
    const q = searchKeyword.toLowerCase();
    list = list.filter(a =>
      (a.title && a.title.toLowerCase().includes(q)) ||
      (a.description && a.description.toLowerCase().includes(q)) ||
      (a.reflection && a.reflection.toLowerCase().includes(q)) ||
      (a.location && a.location.toLowerCase().includes(q))
    );
  }

  // Sort ascending by date for chronological schedule flow
  list.sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));

  // Update banner counters
  document.getElementById('monthEventCount').textContent = list.length;
  const photoTotal = list.reduce((sum, a) => sum + (a.photos ? a.photos.length : 0), 0);
  document.getElementById('monthPhotoCount').textContent = photoTotal;

  const container = document.getElementById('eventsList');

  if (list.length === 0) {
    const monthName = selectedMonth === 'all' ? '' : `${selectedMonth} 月`;
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📅</div>
        <h3>${monthName} 目前尚無已登錄的實習行程</h3>
        <p style="color: var(--text-muted); margin: 8px 0 16px 0;">點擊下方按鈕即可為此月份新增活動、會議或研習紀錄！</p>
        <button class="btn btn-primary" onclick="openAddModalForMonth('${selectedMonth}')">
          ➕ 新增 ${monthName} 活動行程
        </button>
      </div>
    `;
    return;
  }

  container.innerHTML = list.map(act => {
    const parts = (act.date || '').split('-');
    const mStr = parts[1] ? `${parseInt(parts[1], 10)}月` : '--';
    const dStr = parts[2] ? parts[2] : '--';
    const weekday = getWeekday(act.date);
    const photoCount = act.photos ? act.photos.length : 0;
    const catBadge = getCategoryBadge(act.category);

    return `
      <div class="event-card" onclick="openDetailModal('${act.id}')">
        <!-- Date Box -->
        <div class="date-box">
          <span class="date-box-month">${mStr}</span>
          <span class="date-box-day">${dStr}</span>
          <span class="date-box-weekday">${weekday}</span>
        </div>

        <!-- Info -->
        <div class="event-info">
          <div class="event-meta">
            ${catBadge}
            ${act.location ? `<span class="event-location">📍 ${act.location}</span>` : ''}
          </div>
          <h3 class="event-title">${act.title}</h3>
          <p class="event-summary">${act.description || '點擊查看詳細說明與照片...'}</p>
        </div>

        <!-- Action / Photo indicator -->
        <div class="event-action">
          ${photoCount > 0 ? `
            <span class="photo-indicator">📷 ${photoCount} 張相片</span>
          ` : `
            <span class="photo-indicator" style="opacity: 0.7;">📝 詳細說明</span>
          `}
          <span class="view-arrow">查看照片與說明 ➔</span>
        </div>
      </div>
    `;
  }).join('');
}

// Open Detail Modal
function openDetailModal(id) {
  const act = activities.find(a => a.id === id);
  if (!act) return;

  activeDetailActivity = act;

  document.getElementById('detailCatBadge').outerHTML = getCategoryBadge(act.category);
  // Re-fetch badge span
  const newBadge = document.querySelector('.modal-header .cat-badge');
  if (newBadge) newBadge.id = 'detailCatBadge';

  document.getElementById('detailTitle').textContent = act.title;
  document.getElementById('detailDate').textContent = `${act.date || ''} (${getWeekday(act.date)})`;
  document.getElementById('detailLocation').textContent = act.location || '校內 / 未填寫';
  document.getElementById('detailAttendees').textContent = act.attendees || '實習教師';
  
  document.getElementById('detailDescription').textContent = act.description || '（無內容說明）';
  document.getElementById('detailReflection').textContent = act.reflection || '（尚未填寫心得省思）';

  // Photos Gallery
  const photosSection = document.getElementById('detailPhotosSection');
  const gallery = document.getElementById('detailGallery');
  const countElem = document.getElementById('detailPhotoCount');

  if (act.photos && act.photos.length > 0) {
    photosSection.style.display = 'block';
    countElem.textContent = act.photos.length;
    gallery.innerHTML = act.photos.map((p, idx) => `
      <div class="gallery-img-box" onclick="openLightboxFromList(${JSON.stringify(act.photos).replace(/"/g, '&quot;')}, ${idx})">
        <img src="${encodeURI(p)}" alt="相片 ${idx+1}">
      </div>
    `).join('');
  } else {
    photosSection.style.display = 'none';
  }

  openModal('detailModal');
}

function handleEditCurrentActivity() {
  if (!activeDetailActivity) return;
  closeModal('detailModal');
  openEditModal(activeDetailActivity);
}

function handleDeleteCurrentActivity() {
  if (!activeDetailActivity) return;
  if (confirm(`確定要刪除「${activeDetailActivity.title}」這筆行程嗎？`)) {
    activities = activities.filter(a => a.id !== activeDetailActivity.id);
    saveData();
    closeModal('detailModal');
    showToast('🗑️ 行程已成功刪除');
  }
}

// Add / Edit Modal
function openAddModal() {
  openAddModalForMonth(selectedMonth === 'all' ? '8' : selectedMonth);
}

function openAddModalForMonth(monthNum) {
  document.getElementById('formModalTitle').textContent = '➕ 新增實習行程紀錄';
  document.getElementById('activityForm').reset();
  document.getElementById('formActivityId').value = '';
  
  // Set default date to that month
  const m = monthNum.padStart(2, '0');
  const defaultDate = `2026-${m}-01`;
  document.getElementById('formDate').value = defaultDate;
  openModal('formModal');
}

function openEditModal(act) {
  document.getElementById('formModalTitle').textContent = '✏️ 編輯實習行程紀錄';
  document.getElementById('formActivityId').value = act.id;
  document.getElementById('formTitle').value = act.title || '';
  document.getElementById('formCategory').value = act.category || '研習與專業成長';
  document.getElementById('formDate').value = act.date || '';
  document.getElementById('formLocation').value = act.location || '';
  document.getElementById('formAttendees').value = act.attendees || '';
  document.getElementById('formPhotos').value = (act.photos || []).join(', ');
  document.getElementById('formDescription').value = act.description || '';
  document.getElementById('formReflection').value = act.reflection || '';
  openModal('formModal');
}

function saveActivity(e) {
  e.preventDefault();
  const id = document.getElementById('formActivityId').value;
  const title = document.getElementById('formTitle').value.trim();
  const category = document.getElementById('formCategory').value;
  const date = document.getElementById('formDate').value;
  const location = document.getElementById('formLocation').value.trim();
  const attendees = document.getElementById('formAttendees').value.trim();
  
  const rawPhotos = document.getElementById('formPhotos').value.trim();
  const photos = rawPhotos ? rawPhotos.split(',').map(p => p.trim()).filter(Boolean) : [];

  const description = document.getElementById('formDescription').value.trim();
  const reflection = document.getElementById('formReflection').value.trim();

  if (id) {
    const idx = activities.findIndex(a => a.id === id);
    if (idx !== -1) {
      activities[idx] = { ...activities[idx], title, category, date, location, attendees, photos, description, reflection };
      showToast('✅ 行程紀錄已更新');
    }
  } else {
    const newAct = {
      id: 'act-' + Date.now(),
      title,
      category,
      date,
      location,
      attendees,
      photos,
      description,
      reflection
    };
    activities.push(newAct);
    showToast('🎉 行程新增成功');
  }

  saveData();
  closeModal('formModal');
}

// Lightbox
function openLightboxFromList(photosList, startIndex = 0) {
  if (!photosList || photosList.length === 0) return;
  currentLightboxImages = photosList;
  currentLightboxIndex = startIndex;
  updateLightboxView();
  document.getElementById('photoLightbox').classList.add('active');
  document.addEventListener('keydown', handleLightboxKeydown);
}

function updateLightboxView() {
  const imgUrl = currentLightboxImages[currentLightboxIndex];
  document.getElementById('lightboxImg').src = encodeURI(imgUrl);
  document.getElementById('lightboxCaption').textContent = `相片 ${currentLightboxIndex + 1} / ${currentLightboxImages.length} (${imgUrl.split('/').pop()})`;
}

function prevLightboxImage(e) {
  if (e) e.stopPropagation();
  currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxImages.length) % currentLightboxImages.length;
  updateLightboxView();
}

function nextLightboxImage(e) {
  if (e) e.stopPropagation();
  currentLightboxIndex = (currentLightboxIndex + 1) % currentLightboxImages.length;
  updateLightboxView();
}

function closeLightboxDirect() {
  document.getElementById('photoLightbox').classList.remove('active');
  document.removeEventListener('keydown', handleLightboxKeydown);
}

function closeLightbox(e) {
  if (e.target.id === 'photoLightbox') closeLightboxDirect();
}

function handleLightboxKeydown(e) {
  if (e.key === 'Escape') closeLightboxDirect();
  if (e.key === 'ArrowLeft') prevLightboxImage();
  if (e.key === 'ArrowRight') nextLightboxImage();
}

// Modal helper
function openModal(id) {
  const m = document.getElementById(id);
  if (m) m.classList.add('active');
}

function closeModal(id) {
  const m = document.getElementById(id);
  if (m) m.classList.remove('active');
}

function closeModalOnBackdrop(e, id) {
  if (e.target.id === id) closeModal(id);
}

// Settings & Backup
function openSettingsModal() {
  openModal('settingsModal');
}

function exportData() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(activities, null, 2));
  const a = document.createElement('a');
  a.href = dataStr;
  a.download = `教育實習活動日誌備份_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  showToast('📥 備份檔已匯出');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const imported = JSON.parse(evt.target.result);
      if (Array.isArray(imported)) {
        activities = imported;
        saveData();
        closeModal('settingsModal');
        showToast('📂 資料已成功還原！');
      }
    } catch (err) {
      alert('解析失敗：' + err.message);
    }
  };
  reader.readAsText(file);
}

function resetToDefault() {
  if (confirm('確定要重設為初始 4 大預設行程嗎？')) {
    activities = JSON.parse(JSON.stringify(DEFAULT_ACTIVITIES));
    saveData();
    closeModal('settingsModal');
    showToast('🔄 已重設為初始資料');
  }
}

// Theme
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const target = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', target);
  localStorage.setItem('practicum_theme', target);
  document.getElementById('themeToggle').textContent = target === 'dark' ? '☀️' : '🌙';
}

function applyTheme() {
  const saved = localStorage.getItem('practicum_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙';
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2600);
}

window.addEventListener('DOMContentLoaded', init);
</script>
